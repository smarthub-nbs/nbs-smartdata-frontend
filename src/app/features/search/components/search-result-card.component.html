<article
  class="group relative cursor-pointer rounded-xl border border-nbs-border bg-white p-5 shadow-nbs-card transition duration-200 hover:border-nbs-primary/40 hover:shadow-nbs-hover motion-safe:hover:-translate-y-0.5"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <span
          class="rounded-full bg-nbs-primary/10 px-2 py-0.5 text-xs font-semibold text-nbs-primary"
        >
          {{ result().relevanceScore }}% match
        </span>
      </div>
      <a
        [routerLink]="['/datasets', result().dataset.id]"
        class="mt-2 block text-base font-semibold text-slate-900 transition-colors after:absolute after:inset-0 group-hover:text-nbs-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary focus-visible:ring-offset-2"
      >
        {{ result().dataset.title }}
      </a>
      <p class="mt-1 line-clamp-2 text-sm text-nbs-muted">
        {{ result().dataset.description }}
      </p>
      <p class="mt-2 text-xs text-slate-500">
        <span class="font-medium">Why:</span> {{ result().matchReason }}
      </p>
    </div>
  </div>
  <span
    class="relative z-10 mt-3 inline-flex items-center gap-1 text-sm font-medium text-nbs-primary transition-transform group-hover:gap-1.5"
  >
    View dataset
    <app-icon name="arrow-right" [size]="15" />
  </span>
</article>
