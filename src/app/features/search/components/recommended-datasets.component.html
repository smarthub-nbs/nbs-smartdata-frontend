<section class="nbs-panel-muted">
  <h2 class="text-sm font-semibold text-slate-900">{{ title() }}</h2>
  <p class="mt-1 text-xs text-nbs-muted">{{ subtitle() }}</p>

  @if (resolvedDatasets().length === 0) {
    <p class="mt-4 text-sm text-slate-500">No recommendations available.</p>
  } @else {
    <ul class="mt-4 space-y-2">
      @for (dataset of resolvedDatasets(); track dataset.id) {
        <li>
          <a
            [routerLink]="['/datasets', dataset.id]"
            class="group flex cursor-pointer items-start justify-between gap-3 rounded-md border border-transparent p-2 transition-colors hover:border-nbs-primary/30 hover:bg-white"
          >
            <span>
              <span
                class="line-clamp-2 text-sm font-medium text-slate-900 group-hover:text-nbs-primary"
              >
                {{ dataset.title }}
              </span>
              <span class="mt-0.5 block text-xs text-nbs-muted">
                {{ dataset.topicName }} · {{ dataset.region }}
              </span>
            </span>
            <app-icon
              name="arrow-right"
              [size]="14"
              class="mt-0.5 text-slate-400 transition-colors group-hover:text-nbs-primary"
            />
          </a>
        </li>
      }
    </ul>
  }
</section>
