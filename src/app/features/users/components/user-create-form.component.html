<div>
  @if (facade.message()) {
    <div
      role="alert"
      class="mb-5 flex items-start gap-2 rounded-md border px-3 py-2 text-sm"
      [class.border-red-200]="facade.messageError()"
      [class.bg-red-50]="facade.messageError()"
      [class.text-nbs-danger]="facade.messageError()"
      [class.border-emerald-200]="!facade.messageError()"
      [class.bg-emerald-50]="!facade.messageError()"
      [class.text-emerald-900]="!facade.messageError()"
    >
      <span>{{ facade.message() }}</span>
    </div>
  }

  <form (ngSubmit)="submit()">
    <section>
      <h3 class="text-sm font-semibold text-slate-900">Profile</h3>
      <div class="mt-3 grid gap-4 sm:grid-cols-2">
        <app-text-input
          class="sm:col-span-2"
          label="Email"
          type="email"
          placeholder="user@example.com"
          [required]="true"
          [error]="fieldError('email')"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />

        <app-text-input
          class="sm:col-span-2"
          label="Password"
          type="password"
          placeholder="Minimum 8 characters"
          [required]="true"
          [error]="fieldError('password')"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />

        <app-text-input
          label="First name"
          [required]="true"
          [error]="fieldError('firstName')"
          [ngModel]="firstName()"
          (ngModelChange)="firstName.set($event)"
          name="firstName"
        />

        <app-text-input
          label="Last name"
          [required]="true"
          [error]="fieldError('lastName')"
          [ngModel]="lastName()"
          (ngModelChange)="lastName.set($event)"
          name="lastName"
        />
      </div>
    </section>

    <section class="mt-6">
      <h3 class="text-sm font-semibold text-slate-900">Access</h3>
      <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center">
        <label
          class="inline-flex cursor-pointer items-center gap-2 text-sm text-slate-700"
        >
          <input
            type="checkbox"
            class="size-4 rounded border-slate-300 text-nbs-primary focus:ring-nbs-primary/30"
            [checked]="isActive()"
            (change)="isActive.set($any($event.target).checked)"
          />
          Active on create
        </label>
        <label
          class="inline-flex cursor-pointer items-center gap-2 text-sm text-slate-700"
        >
          <input
            type="checkbox"
            class="size-4 rounded border-slate-300 text-nbs-primary focus:ring-nbs-primary/30"
            [checked]="isVerified()"
            (change)="isVerified.set($any($event.target).checked)"
          />
          Mark as verified
        </label>
      </div>
    </section>

    <section class="mt-6">
      <h3 class="text-sm font-semibold text-slate-900">Groups</h3>
      <div class="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        @for (group of facade.groups(); track group.id) {
          <label
            class="inline-flex cursor-pointer items-center gap-2 rounded-md border px-3 py-2 text-sm transition-colors"
            [class.border-nbs-primary]="isGroupSelected(group.name)"
            [class.bg-nbs-primary-soft]="isGroupSelected(group.name)"
            [class.text-nbs-ink]="isGroupSelected(group.name)"
            [class.border-slate-200]="!isGroupSelected(group.name)"
            [class.text-slate-700]="!isGroupSelected(group.name)"
            [class.hover:border-nbs-primary]="!isGroupSelected(group.name)"
          >
            <input
              type="checkbox"
              class="size-4 rounded border-slate-300 text-nbs-primary focus:ring-nbs-primary/30"
              [checked]="isGroupSelected(group.name)"
              (change)="toggleGroup(group.name, $any($event.target).checked)"
            />
            {{ formatGroupLabel(group.name) }}
          </label>
        }
      </div>
    </section>

    <button
      type="submit"
      class="hidden"
      aria-hidden="true"
      tabindex="-1"
    ></button>
  </form>
</div>
