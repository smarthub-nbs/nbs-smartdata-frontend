<div class="flex flex-wrap items-end gap-3">
  <label class="min-w-[12rem] flex-1">
    <span class="mb-1 block text-xs font-medium text-slate-600">Area</span>
    <select
      class="h-10 w-full cursor-pointer rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-800 transition-colors duration-200 focus:border-nbs-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary/30"
      [value]="areaValue()" (change)="onAreaChange($event)">
      <option value="national" [selected]="areaValue() === 'national'">
        National
      </option>
      <option value="all" [selected]="areaValue() === 'all'">All regions</option>
      <option value="mainland" [selected]="areaValue() === 'mainland'">
        Mainland regions
      </option>
      <option value="island" [selected]="areaValue() === 'island'">
        Island (Zanzibar) regions
      </option>
    </select>
  </label>
  @if (showRegion()) {
  <label class="min-w-[12rem] flex-1">
    <span class="mb-1 block text-xs font-medium text-slate-600">{{ regionLabel() }}</span>
    <select
      class="h-10 w-full cursor-pointer rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-800 transition-colors duration-200 focus:border-nbs-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary/30"
      [value]="regionKey()" (change)="onRegionChange($event)">
      <option value="" [selected]="regionKey() === ''">All regions in this area</option>
      @for (region of regions(); track region.key) {
      <option [value]="region.key" [selected]="region.key === regionKey()">
        {{ region.label }}
      </option>
      }
    </select>
  </label>
  }
</div>
