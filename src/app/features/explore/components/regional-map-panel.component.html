<section class="rounded-lg border border-nbs-border bg-white p-5 shadow-sm">
  <h2 class="text-sm font-semibold text-slate-900">Regional map view</h2>
  <p class="mt-1 text-xs text-nbs-muted">
    Intensity by region (simplified grid — full geospatial map in a later
    release).
  </p>

  <ul class="mt-4 grid gap-x-6 gap-y-3 sm:grid-cols-2">
    @for (cell of cells(); track cell.region) {
    <li class="border-t border-slate-100 pt-3">
      <div class="flex items-baseline justify-between gap-3">
        <span class="text-sm font-semibold text-slate-900">
          {{ cell.region }}
        </span>
        <span class="text-sm font-medium text-slate-700">
          {{ cell.label }}
        </span>
      </div>
      <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-nbs-primary-soft" aria-hidden="true">
        <span class="block h-full rounded-full bg-nbs-primary" [style.width]="cell.intensityPercent"></span>
      </div>
    </li>
    }
  </ul>
</section>
