<div class="mx-auto max-w-lg space-y-6">
  <header>
    <h1 class="text-2xl font-semibold text-slate-900">Sign in</h1>
    <p class="mt-1 text-sm text-nbs-muted">
      Use your SmartData Hub account.
    </p>
  </header>

  <section class="rounded-lg border border-nbs-border bg-white p-6 shadow-sm">
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <app-text-input formControlName="username" label="Email" placeholder="you@example.com" [required]="true"
        [error]="fieldError('username')" />

      <app-text-input formControlName="password" label="Password" type="password" placeholder="Enter your password"
        [required]="true" [error]="fieldError('password')" />

      @if (errorMessage()) {
      <p class="text-sm text-nbs-danger" role="alert">
        {{ errorMessage() }}
      </p>
      }

      <div class="flex items-center gap-2">
        <app-button type="submit" variant="primary" [loading]="submitting()">
          Sign in
        </app-button>
        <a routerLink="/" class="text-sm text-slate-600 hover:text-nbs-primary">
          Cancel
        </a>
      </div>
    </form>

    <div class="mt-6 rounded-md bg-nbs-surface p-4 text-sm text-slate-700">
      <p>Sign in with the email and password registered in the backend.</p>
      <a routerLink="/register" [queryParams]="registerQueryParams"
        class="mt-2 inline-block font-medium text-nbs-primary hover:underline">
        Create an account
      </a>
    </div>
  </section>
</div>
