<div class="mx-auto max-w-lg space-y-6">
  <header>
    <h1 class="text-2xl font-semibold text-slate-900">Reset password</h1>
    <p class="mt-1 text-sm text-nbs-muted">
      Choose a new password for your account.
    </p>
  </header>

  <section class="rounded-lg border border-nbs-border bg-white p-6 shadow-sm">
    @if (!token) {
    <p class="text-sm text-nbs-danger" role="alert">
      This reset link is invalid or has expired. Request a new one from the sign-in page.
    </p>
    <a routerLink="/forgot-password" class="mt-4 inline-block text-sm font-medium text-nbs-primary hover:underline">
      Request new reset link
    </a>
    } @else {
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <app-text-input formControlName="password" label="New password" type="password"
        placeholder="Use at least 8 characters" [required]="true" [error]="fieldError('password')" />
      <app-text-input formControlName="confirmPassword" label="Confirm password" type="password"
        placeholder="Repeat your password" [required]="true" [error]="fieldError('confirmPassword')" />

      @if (errorMessage()) {
      <p class="text-sm text-nbs-danger" role="alert">{{ errorMessage() }}</p>
      }

      <div class="flex items-center gap-2">
        <app-button type="submit" variant="primary" [loading]="submitting()">
          Reset password
        </app-button>
        <a routerLink="/login" class="text-sm text-slate-600 hover:text-nbs-primary">
          Cancel
        </a>
      </div>
    </form>
    }
  </section>
</div>
