<div class="mx-auto max-w-lg space-y-6">
  <header>
    <h1 class="text-2xl font-semibold text-slate-900">Forgot password</h1>
    <p class="mt-1 text-sm text-nbs-muted">
      We will email you a link to reset your password.
    </p>
  </header>

  <section class="rounded-lg border border-nbs-border bg-white p-6 shadow-sm">
    @if (submitted()) {
      <div
        class="rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900"
        role="status"
      >
        If an account exists for that email, a password reset message has been
        sent.
      </div>
      <a
        routerLink="/login"
        class="mt-4 inline-block text-sm font-medium text-nbs-primary hover:underline"
      >
        Back to sign in
      </a>
    } @else {
      <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <app-text-input
          formControlName="email"
          label="Email"
          type="email"
          placeholder="you@example.com"
          [required]="true"
          [error]="fieldError()"
        />

        @if (errorMessage()) {
          <p class="text-sm text-nbs-danger" role="alert">
            {{ errorMessage() }}
          </p>
        }

        <div class="flex items-center gap-2">
          <app-button type="submit" variant="primary" [loading]="submitting()">
            Send reset link
          </app-button>
          <a
            routerLink="/login"
            class="text-sm text-slate-600 hover:text-nbs-primary"
          >
            Cancel
          </a>
        </div>
      </form>
    }
  </section>
</div>
