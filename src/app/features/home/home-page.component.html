<div class="mx-auto max-w-6xl space-y-8 pb-12">
  <section class="mx-auto max-w-2xl space-y-5 pt-10 text-center sm:pt-16">
    <div class="space-y-2">
      <h1 class="text-3xl font-semibold leading-tight text-slate-900 sm:text-4xl">
        What statistics are you looking for?
      </h1>
      <p class="text-sm text-slate-600 sm:text-base">
        Official open data from Tanzania's National Bureau of Statistics.
      </p>
    </div>

    <form (ngSubmit)="submitSmartSearch()">
      <div
        class="flex flex-col gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-nbs-card transition-colors focus-within:border-nbs-primary focus-within:ring-2 focus-within:ring-nbs-primary/20 sm:flex-row sm:items-center">
        <label class="relative min-w-0 flex-1">
          <span class="sr-only">Search official statistics</span>
          <app-icon name="search" [size]="20"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input type="search" name="homeSearch" placeholder="Search inflation, population, GDP, agriculture..."
            class="h-11 w-full border-0 bg-transparent pl-10 pr-3 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-0 sm:h-12"
            [(ngModel)]="smartQuery" />
        </label>
        <app-button type="submit" variant="primary" size="lg">
          Search
        </app-button>
      </div>
    </form>
  </section>

  @if (topics().length > 0) {
  <section class="mx-auto max-w-3xl text-center">
    <h2 class="mb-3 text-xs font-semibold uppercase tracking-wide text-nbs-muted">
      {{ topics().length === 1 ? 'Popular topic' : 'Browse by topic' }}
    </h2>
    <div class="flex flex-wrap justify-center gap-2">
      @for (topic of topics(); track topic.route) {
      <button type="button"
        class="group inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-200 bg-white py-1.5 pl-3 pr-1.5 text-sm font-medium text-slate-700 transition-colors duration-200 hover:border-nbs-primary/30 hover:bg-nbs-primary-soft hover:text-nbs-primary"
        (click)="goTo(topic.route)">
        <span>{{ topic.label }}</span>
        <span
          class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-nbs-muted transition-colors group-hover:bg-white group-hover:text-nbs-primary">
          {{ topic.count }}
        </span>
      </button>
      }
    </div>
  </section>
  }
</div>
