<div class="space-y-6">
  <header>
    <h1 class="text-2xl font-semibold text-slate-900">Developers</h1>
    <p class="mt-1 text-sm text-nbs-muted">
      Unified Open API Gateway — integrate official Tanzania statistics into
      your applications (SRS 5.2).
    </p>
  </header>

  <section class="rounded-lg border border-nbs-border bg-white p-5 shadow-sm">
    <div class="flex items-center gap-2">
      <svg class="size-5 text-nbs-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      <h2 class="text-base font-semibold text-slate-900">Quick start</h2>
    </div>
    <p class="mt-1 text-sm text-nbs-muted">
      Authenticate with an API key in the
      <code class="rounded bg-nbs-surface px-1 py-0.5 font-mono text-xs">X-API-Key</code>
      header, then call any gateway endpoint.
    </p>

    <div class="mt-4 space-y-3">
      <div>
        <p class="text-xs font-medium text-slate-600">Base URL</p>
        <div class="mt-1 flex items-center gap-2 rounded-md border border-slate-200 bg-nbs-surface px-3 py-2">
          <code class="min-w-0 flex-1 truncate font-mono text-sm text-slate-800">{{
            api.baseUrl
          }}</code>
          <app-copy-button [value]="api.baseUrl" label="Copy base URL" />
        </div>
      </div>

      <div>
        <p class="text-xs font-medium text-slate-600">Example request</p>
        <div class="mt-1 flex items-start gap-2 rounded-md border border-slate-200 bg-slate-900 px-3 py-2">
          <code class="min-w-0 flex-1 break-all font-mono text-xs text-emerald-200">{{
            quickStartCurl()
          }}</code>
          <app-copy-button [value]="quickStartCurl()" label="Copy curl example" tone="inverse" />
        </div>
      </div>
    </div>
  </section>

  <div class="grid gap-6 lg:grid-cols-2">
    <app-api-docs-panel />
    <app-api-key-manager />
  </div>

  <div id="try-it-console" class="scroll-mt-6">
    <app-api-try-it-console />
  </div>
</div>
