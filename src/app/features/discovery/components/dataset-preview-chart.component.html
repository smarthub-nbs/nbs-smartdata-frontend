<section class="nbs-panel space-y-3" aria-labelledby="dataset-preview-chart-heading">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h2 id="dataset-preview-chart-heading" class="text-sm font-semibold text-slate-900">
        Data preview chart
      </h2>
      <p class="mt-0.5 text-xs text-nbs-muted">
        {{ chartLabel() }} from the primary file
      </p>
    </div>
    <a routerLink="/explore" [queryParams]="{ indicator: dataset().id }"
      class="text-xs font-semibold text-nbs-primary hover:underline">
      Open in Explore
    </a>
  </div>

  @if (loading()) {
  <div class="flex h-48 items-center justify-center rounded-lg border border-dashed border-slate-200 bg-slate-50">
    <p class="text-sm text-nbs-muted">Loading chart…</p>
  </div>
  } @else if (unavailable()) {
  <div class="rounded-lg border border-dashed border-slate-200 bg-slate-50 px-4 py-8 text-center">
    <p class="text-sm text-slate-700">Chart preview is not available for this file.</p>
    <p class="mt-1 text-xs text-nbs-muted">
      Structured CSV/XLSX files with numeric series can be charted here.
    </p>
  </div>
  } @else {
  <div class="h-48">
    <canvas #canvas [attr.aria-label]="chartLabel() + ' preview chart'"></canvas>
  </div>
  }
</section>
