<section class="nbs-panel">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-nbs-muted">
    Activity log
  </h2>

  @if (rows().length === 0) {
  <p class="mt-3 text-sm text-nbs-muted">No activity recorded yet.</p>
  } @else {
  <ul class="mt-4 divide-y divide-slate-100">
    @for (row of rows(); track row.key) {
    <li class="flex flex-col gap-1 py-3 sm:flex-row sm:items-baseline sm:gap-4">
      <time class="shrink-0 text-sm font-medium text-slate-900 sm:w-44" [dateTime]="row.createdAt">
        {{ row.createdAt | date: 'medium' }}
      </time>
      <div class="min-w-0">
        <p class="text-sm text-slate-700">
          {{ row.label }}
          <span class="text-nbs-muted">— {{ row.actor }}</span>
        </p>
        @if (row.details) {
        <p class="mt-0.5 break-words text-xs text-nbs-muted">{{ row.details }}</p>
        }
      </div>
    </li>
    }
  </ul>
  }
</section>
