<div class="nbs-panel-compact" role="search">
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <label class="lg:col-span-2">
      <span class="mb-1 block text-xs font-medium text-slate-600">Keyword</span>
      <input type="search"
        class="h-10 w-full rounded-md border border-slate-300 px-3 text-sm focus:border-nbs-primary focus:outline-none focus:ring-2 focus:ring-nbs-primary/30"
        placeholder="Title, keyword, region…" [ngModel]="filters().query"
        (ngModelChange)="onFilterChange('query', $event)" />
    </label>

    <label>
      <span class="mb-1 block text-xs font-medium text-slate-600">Topic</span>
      <select
        class="h-10 w-full rounded-md border border-slate-300 px-3 text-sm focus:border-nbs-primary focus:outline-none focus:ring-2 focus:ring-nbs-primary/30"
        [ngModel]="filters().topicSlug" (ngModelChange)="onFilterChange('topicSlug', $event)">
        <option value="">All topics</option>
        @for (topic of datasetService.topics(); track topic.slug) {
        <option [value]="topic.slug">{{ topic.name }}</option>
        }
      </select>
    </label>
  </div>

  @if (showAdvanced()) {
  <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <label>
      <span class="mb-1 block text-xs font-medium text-slate-600">Format</span>
      <select
        class="h-10 w-full rounded-md border border-slate-300 px-3 text-sm focus:border-nbs-primary focus:outline-none focus:ring-2 focus:ring-nbs-primary/30"
        [ngModel]="filters().format" (ngModelChange)="onFilterChange('format', $event)">
        <option value="">All formats</option>
        @for (format of datasetService.formats(); track format) {
        <option [value]="format">{{ format }}</option>
        }
      </select>
    </label>

    <label>
      <span class="mb-1 block text-xs font-medium text-slate-600">Frequency</span>
      <select
        class="h-10 w-full rounded-md border border-slate-300 px-3 text-sm focus:border-nbs-primary focus:outline-none focus:ring-2 focus:ring-nbs-primary/30"
        [ngModel]="filters().frequency" (ngModelChange)="onFilterChange('frequency', $event)">
        <option value="">All frequencies</option>
        @for (frequency of datasetService.frequencies(); track frequency) {
        <option [value]="frequency">{{ frequency }}</option>
        }
      </select>
    </label>

    <label>
      <span class="mb-1 block text-xs font-medium text-slate-600">Region</span>
      <select
        class="h-10 w-full rounded-md border border-slate-300 px-3 text-sm focus:border-nbs-primary focus:outline-none focus:ring-2 focus:ring-nbs-primary/30"
        [ngModel]="filters().region" (ngModelChange)="onFilterChange('region', $event)">
        <option value="">All regions</option>
        @for (region of datasetService.regions(); track region) {
        <option [value]="region">{{ region }}</option>
        }
      </select>
    </label>
  </div>
  }

  <div class="mt-3 flex items-center justify-between">
    <button type="button"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-md px-2 py-1 text-sm font-medium text-slate-600 transition-colors hover:text-nbs-primary"
      [attr.aria-expanded]="showAdvanced()" (click)="toggleAdvanced()">
      <app-icon name="sliders" [size]="15" />
      {{ showAdvanced() ? 'Fewer filters' : 'More filters' }}
    </button>

    @if (activeFilterCount() > 0) {
    <app-button variant="ghost" size="sm" (clicked)="onClear()">
      Clear filters ({{ activeFilterCount() }})
    </app-button>
    }
  </div>
</div>
