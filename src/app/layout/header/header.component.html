<header class="shrink-0 border-b border-nbs-border bg-white">
  <div class="nbs-container flex h-14 items-center justify-between gap-4">
    <div class="flex min-w-0 items-center gap-4">
      <a routerLink="/"
        class="flex shrink-0 items-center gap-2 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary">
        <span class="flex size-9 items-center justify-center rounded-md bg-white p-1 ring-1 ring-nbs-border"
          aria-hidden="true">
          <img src="/nbs-logo.png" alt="" class="size-full object-contain" />
        </span>
        <span class="hidden sm:block">
          <span class="block text-sm font-semibold leading-tight text-slate-900">NBS</span>
          <span class="block text-xs leading-tight text-nbs-muted">SmartData Hub</span>
        </span>
      </a>

      <nav class="hidden items-center gap-1 lg:flex" aria-label="Main navigation">
        @for (item of visibleNavItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="bg-nbs-primary/10 text-nbs-primary"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900">
          {{ item.label }}
        </a>
        }
      </nav>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      @if (showHeaderSearch()) {
      <div class="hidden md:block">
        <app-search-bar variant="compact" label="Search datasets" placeholder="Search statistics…"
          inputName="headerSearch" [showSubmit]="false" [(query)]="searchQuery" (submitted)="onSearchSubmit($event)" />
      </div>
      }

      @if (auth.isAuthenticated()) {
      <app-profile-menu [userName]="auth.user()?.name ?? ''" [userEmail]="auth.user()?.email ?? ''"
        [userRole]="roleLabel()" [userInitials]="auth.user()?.initials ?? '?'" (signOut)="auth.signOut()" />
      } @else {
      <app-button variant="primary" size="sm" (clicked)="goToLogin()">
        Sign in
      </app-button>
      }

      <div class="lg:hidden">
        <app-button variant="ghost" size="sm" type="button" aria-label="Open navigation menu"
          (clicked)="mobileNav.toggle()">
          <app-icon name="menu" [size]="20" />
        </app-button>
      </div>
    </div>
  </div>

  @if (mobileNav.open()) {
  <nav class="border-t border-nbs-border bg-white px-4 py-3 lg:hidden" aria-label="Mobile navigation">
    @if (showHeaderSearch()) {
    <div class="mb-3">
      <app-search-bar variant="compact" label="Search datasets" placeholder="Search statistics…"
        inputName="mobileHeaderSearch" [showSubmit]="false" [(query)]="searchQuery"
        (submitted)="onSearchSubmit($event)" />
    </div>
    }
    <div class="flex flex-col gap-1">
      @for (item of visibleNavItems(); track item.route) {
      <a [routerLink]="item.route" routerLinkActive="bg-nbs-primary/10 text-nbs-primary"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="rounded-md px-3 py-2 text-sm font-medium text-slate-700" (click)="mobileNav.close()">
        {{ item.label }}
      </a>
      }
    </div>
  </nav>
  }
</header>
