    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-2 rounded-full border border-transparent py-1 pl-1 pr-2 transition-colors hover:border-slate-200 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary focus-visible:ring-offset-2"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        [attr.aria-controls]="menuId"
        (click)="toggleMenu($event)"
      >
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-nbs-primary to-nbs-accent text-xs font-semibold text-white shadow-sm"
          aria-hidden="true"
        >
          {{ userInitials() }}
        </span>
        <span class="hidden min-w-0 text-left sm:block">
          <span class="block truncate text-sm font-medium text-slate-900">
            {{ userName() }}
          </span>
          <span class="block truncate text-xs text-nbs-muted">
            {{ userRole() }}
          </span>
        </span>
        <svg
          class="hidden size-4 shrink-0 text-slate-400 transition-transform sm:block"
          [class.rotate-180]="menuOpen()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M6 9l6 6 6-6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      @if (menuOpen()) {
        <div
          [id]="menuId"
          role="menu"
          class="absolute right-0 z-50 mt-2 w-64 origin-top-right rounded-lg border border-nbs-border bg-white py-1 shadow-lg ring-1 ring-black/5"
        >
          <div class="border-b border-nbs-border px-4 py-3">
            <p class="truncate text-sm font-semibold text-slate-900">
              {{ userName() }}
            </p>
            <p class="truncate text-xs text-nbs-muted">{{ userEmail() }}</p>
          </div>

          <div class="py-1" role="none">
            <a
              routerLink="/account"
              role="menuitem"
              class="flex w-full items-center gap-2 px-4 py-2 text-sm text-slate-700 transition-colors hover:bg-slate-50"
              (click)="closeMenu()"
            >
              <svg
                class="size-4 text-slate-400"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                aria-hidden="true"
              >
                <path
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Account settings
            </a>

            <button
              type="button"
              role="menuitem"
              class="flex w-full items-center gap-2 px-4 py-2 text-sm text-slate-700 transition-colors hover:bg-slate-50"
              (click)="onSignOut()"
            >
              <svg
                class="size-4 text-slate-400"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                aria-hidden="true"
              >
                <path
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Sign out
            </button>
          </div>
        </div>
      }
    </div>
