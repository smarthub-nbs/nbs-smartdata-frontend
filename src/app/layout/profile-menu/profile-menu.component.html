<div class="relative">
  <button type="button"
    class="flex cursor-pointer items-center gap-2 rounded-full border border-transparent py-1 pl-1 pr-2 transition-colors hover:border-slate-200 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-nbs-primary focus-visible:ring-offset-2"
    [attr.aria-expanded]="menuOpen()" aria-haspopup="menu" [attr.aria-controls]="menuId" (click)="toggleMenu($event)">
    <span
      class="flex size-8 shrink-0 items-center justify-center rounded-full bg-nbs-primary text-xs font-semibold text-white shadow-sm"
      aria-hidden="true">
      {{ userInitials() }}
    </span>
    <span class="hidden min-w-0 text-left sm:block">
      <span class="block truncate text-sm font-medium text-slate-900">
        {{ userName() }}
      </span>
      <span class="block truncate text-xs text-nbs-muted">
        {{ userRole() }}
      </span>
    </span>
    <app-icon name="chevron-down" [size]="16" class="hidden text-slate-400 transition-transform sm:block"
      [class.rotate-180]="menuOpen()" />
  </button>

  @if (menuOpen()) {
  <div [id]="menuId" role="menu"
    class="absolute right-0 z-50 mt-2 w-64 origin-top-right rounded-lg border border-nbs-border bg-white py-1 shadow-lg ring-1 ring-black/5">
    <div class="border-b border-nbs-border px-4 py-3">
      <p class="truncate text-sm font-semibold text-slate-900">
        {{ userName() }}
      </p>
      <p class="truncate text-xs text-nbs-muted">{{ userEmail() }}</p>
    </div>

    <div class="py-1" role="none">
      <a routerLink="/account" role="menuitem"
        class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-sm text-slate-700 transition-colors hover:bg-slate-50"
        (click)="closeMenu()">
        <app-icon name="settings" [size]="16" class="text-slate-400" />
        Account settings
      </a>

      <button type="button" role="menuitem"
        class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-sm text-slate-700 transition-colors hover:bg-slate-50"
        (click)="onSignOut()">
        <app-icon name="log-out" [size]="16" class="text-slate-400" />
        Sign out
      </button>
    </div>
  </div>
  }
</div>
